
name: Upgrade Next.js Test

on:
  push:
    branches:
      - upgrade-nextjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout upgrade branch
        uses: actions/checkout@v4
        with:
          ref: upgrade-nextjs
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Upgrade dependencies
        run: |
          npm install next@^15 react@^19 react-dom@^19 \
            eslint-config-next@^15
          npm install -D @types/react@^19 @types/react-dom@^19

      - name: Check production build
        run: npm run build

      - name: Commit updated dependency files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Upgrade Next.js and React dependencies" || exit 0
          git push origin upgrade-nextjs
